<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Academy Pro - Ultimate MCQ & Test Prep Platform</title>
    <meta name="description" content="Future Academy Pro - Pakistan's leading digital platform for solved MCQs, online practice quizzes, and exam preparation." />
    <meta property="og:title" content="Future Academy Pro" />
    <meta property="og:description" content="Solve 50,000+ solved MCQs for FPSC, PPSC, KPPSC, BPSC, SPSC, NTS, CSS, PMS, General Knowledge, and Everyday Science." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Dancing+Script:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('futureacademy_theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
