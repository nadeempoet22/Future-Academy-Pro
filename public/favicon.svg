<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="faBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="capGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#faBgGrad)" stroke="url(#goldBorder)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="#FDE68A" stroke-width="0.75" stroke-dasharray="2 1.5" opacity="0.6" />

  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#softGlow)">
    <!-- Top Diamond / Cap Plate -->
    <polygon points="32,12 49,19 32,26 15,19" fill="url(#capGold)" />
    
    <!-- Cap Skull Base Underneath -->
    <path d="M22,21.5 L22,26 C22,29.5 42,29.5 42,26 L42,21.5" fill="#B45309" />
    
    <!-- Center Button -->
    <circle cx="32" cy="19" r="1.5" fill="#FFFFFF" />
    
    <!-- Gold Tassel Hanging to the right -->
    <path d="M32,19 Q44,21 44.5,27.5" stroke="#FEF08A" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <circle cx="44.5" cy="28.5" r="1.2" fill="#F59E0B" />
    <polygon points="43.8,29 45.2,29 45.6,32 43.4,32" fill="#FEF08A" />
  </g>

  <!-- Central Star of Excellence -->
  <polygon points="32,29 33.5,32.5 37.3,32.7 34.2,34.9 35.4,38.5 32,36.2 28.6,38.5 29.8,34.9 26.7,32.7 30.5,32.5" fill="#FFFFFF" />

  <!-- Open Study Book at the bottom -->
  <g filter="url(#softGlow)">
    <!-- Left Page -->
    <path d="M32,48.5 C27.5,45.5 20.5,45.5 16,47 L16,40.5 C20.5,39 27.5,39 32,42 Z" fill="#FFFFFF" />
    <!-- Right Page -->
    <path d="M32,48.5 C36.5,45.5 43.5,45.5 48,47 L48,40.5 C43.5,39 36.5,39 32,42 Z" fill="#FFFFFF" />
    <!-- Center spine & golden ribbon -->
    <path d="M16,47 C20.5,45.5 27.5,45.5 32,48.5 C36.5,45.5 43.5,45.5 48,47" fill="none" stroke="url(#goldBorder)" stroke-width="2" stroke-linecap="round" />
    <line x1="32" y1="42" x2="32" y2="52" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
